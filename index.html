/* ---------- receipts: shrink a photo so it fits in the database ---------- */
function readImage(file){return new Promise(function(res,rej){
  var fr=new FileReader();fr.onerror=function(){rej(new Error('read'))};
  fr.onload=function(){var im=new Image();im.onerror=function(){rej(new Error('image'))};
    im.onload=function(){var dim=1300,q=.72,out='';
      for(var i=0;i<9;i++){var sc=Math.min(1,dim/Math.max(im.width,im.height));var c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        out=c.toDataURL('image/jpeg',q);if(out.length<185000)break;if(q>.46)q-=.1;else dim=dim*.8}
      if(out.length>=240000)rej(new Error('big'));else res(out)};
    im.src=fr.result};
  fr.readAsDataURL(file)})}
async function imageFrom(d){if(!d.receipt||!d.receipt.size)return null;return readImage(d.receipt)}

/* ---------- charges (monthly maintenance + special collections) ---------- */
function driveOf(id){return S.drives.filter(function(d){return d.id===id})[0]}
function applies(d,flat){var f=d&&d.flats;return !f||!f.length||f.indexOf(String(flat).trim().toUpperCase())>-1}
function monthLabel(m){var p=m.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
function ordinal(n){n=Number(n)||0;var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function dayDiff(a,b){return Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000)}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nextMonth(m){var p=m.split('-');return monthOf(new Date(+p[0],+p[1],1))}
function allPlans(){var a=S.plans.slice().sort(function(x,y){return (x.ts||0)-(y.ts||0)});
  if(!a.length)a=[{id:'maint',legacy:true,virtual:true,title:'Monthly maintenance',kind:'monthly',rates:[{from:'0000-00',amount:Number(S.settings.fee)||0}],dueDay:8,graceDay:12,start:monthOf(new Date())}];return a}
function planList(){return allPlans().filter(function(p){return !p.archived})}
function curPlan(){var l=planList();return l.filter(function(p){return p.id===S.plan})[0]||l[0]}
function rateFor(p,m){var r=(p.rates||[]).slice().sort(function(a,b){return a.from<b.from?-1:1});var amt=r.length?Number(r[0].amount):0;r.forEach(function(x){if(x.from<=m)amt=Number(x.amount)});return amt}
function planChargeId(p,m){return p.legacy?m:p.id+'_'+m}
function planCharge(p,m){var dd=Number(p.dueDay)||8;var due=m+'-'+pad(dd);return {id:planChargeId(p,m),title:p.title+' · '+monthLabel(m),amount:rateFor(p,m),due:due,grace:addDays(due,3),flats:p.flats||null,month:m,plan:p}}
function chargeInfo(id){
  var d=driveOf(id);if(d)return {id:id,title:d.title,amount:Number(d.amount)||0,due:d.due||'',grace:d.due?addDays(d.due,3):'',flats:d.flats||null,drive:d};
  var ps=allPlans();var m=/^(\d{4}-\d{2})$/.exec(id);
  if(m){var lp=ps.filter(function(p){return p.legacy})[0]||ps[0];return planCharge(lp,m[1])}
  var pm=/^(.+)_(\d{4}-\d{2})$/.exec(id);
  if(pm){var pp=ps.filter(function(p){return p.id===pm[1]})[0];if(pp)return planCharge(pp,pm[2])}
  return null}
function dueStatus(c){
  if(!c||!c.due)return {t:'Pending',cls:'warn',lvl:1};
  var d=dayDiff(c.due,todayStr());
  if(d>1)return {t:'Due in '+d+' days',cls:d<=3?'warn':'',lvl:d<=3?1:0};
  if(d===1)return {t:'Due tomorrow',cls:'warn',lvl:1};
  if(d===0)return {t:'Due today',cls:'warn',lvl:1};
  var n=-d;
  if(n<=3)return {t:'Overdue by '+n+' day'+(n===1?'':'s'),cls:'warn',lvl:2};
  return {t:'Outstanding · '+n+' days',cls:'bad',lvl:3}}
function myCharges(flat){
  var out=[];var now=new Date();var nowM=monthOf(now);var lim=monthOf(new Date(now.getFullYear(),now.getMonth()-11,1));
  planList().forEach(function(p){
    if(!applies(p,flat))return;
    var m=p.start||nowM;if(m<lim)m=lim;var n=0;
    while(m<=nowM&&n<14){var c=planCharge(p,m);var du=dueFor(c.id,flat);if(!(du&&du.paid)||m===nowM)out.push(c);m=nextMonth(m);n++}});
  S.drives.forEach(function(d){if(!applies(d,flat))return;var du=dueFor(d.id,flat);if(!(du&&du.paid))out.push(chargeInfo(d.id))});
  return out.sort(function(a,b){return (a.due||'')<(b.due||'')?-1:1})}
function chargeTitle(id){var c=chargeInfo(id);return c?c.title:'Collection'}
function chargeAmount(id){var c=chargeInfo(id);return c?c.amount:0}
function curCharge(){return S.drive||planChargeId(curPlan(),S.month)}
function dueKey(c,f){return c+'_'+slug(f)}
function dueFor(c,flat){return S.dues[dueKey(c,flat)]}
function chargeOf(d){return d.charge||d.month}

  f.addEventListener('submit',async function(e){e.preventDefault();var btn=f.querySelector('button[type=submit]');btn.disabled=true;
    var data={};new FormData(f).forEach(function(v,k){var x=typeof v==='string'?v.trim():v;if(k in data)data[k]=[].concat(data[k],x);else data[k]=x});
    var ok=false;try{ok=await handler(data)}catch(err){toast(errMsg(err))}btn.disabled=false;if(ok)closeSheet()});

    else{var ci=chargeInfo(cur);dh.innerHTML='<b style="color:var(--ink)">'+esc(curPlan().title)+'</b> · '+fmt(amt)+' per flat · due '+fd(ci.due)+(may('payments')?' · <button class="chipbtn" data-act="manage">Rates & dates</button>':'')}
    var fl=flats();if(isDrive){var dd=driveOf(S.drive);fl=fl.filter(function(f){return applies(dd,f.flat)})}var L=$('#list');
    if(!fl.length){$('#sum').hidden=true;L.innerHTML='<div class="empty"><b>No flats yet</b>Add residents in the Directory and each flat will appear here.</div>';return}

      '<div class="progress" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div><div class="meta">'+paid.length+' of '+fl.length+' flats paid · '+(fl.length-paid.length)+' pending</div>'+(may('payments')&&paid.length<fl.length?'<div class="actions"><button class="btn ghost small" data-act="remind">Remind unpaid flats</button></div>':'');
    L.innerHTML=fl.map(function(f){var d=dueFor(cur,f.flat);var ok=d&&d.paid;
      var hasR=ok&&(d.sub||d.hasProof);
      return '<div class="card"><div class="row"><div class="res" style="align-items:center"><div class="flatno">'+esc(f.flat)+'</div><div><div class="title">'+esc(f.name)+'</div>'+

        '<span class="pill '+(ok?'ok':SD.cls)+'">'+(ok?fmt(d.amount):'Pending')+'</span></div>'+
        (may('payments')?'<div class="actions">'+(ok?'<button class="btn ghost small" data-act="undoDue" data-flat="'+esc(f.flat)+'">Undo payment</button>'+(hasR?'<button class="btn ghost small" data-act="viewDue" data-id="'+esc(d.id)+'">Receipt</button>':''):'<button class="btn small" data-act="payDue" data-flat="'+esc(f.flat)+'">Record payment</button>')+'</div>':'')+'</div>'}).join('')}},

 accounts:{label:'Accounts',

      if(!p.length){L.innerHTML='<div class="empty"><b>Nothing received this month</b>Payments appear here once the committee approves a receipt or records other income.</div>';return}

 chat:{label:'Chat',
  shell:function(){return '<div class="bar"><div><h2 id="chTitle">Chat</h2><div class="sub" id="chSub"></div></div><div class="actions" id="chAct"></div></div><div class="chips" id="chips"></div><div id="msgs"></div>'+

 requests:{label:'Requests',

function tabOrder(){var o=['home','collection'];if(may('expense'))o.push('accounts');o.push('chat','requests');if(may('people'))o.push('directory');return o}
function tabOk(k){return k==='notices'||tabOrder().indexOf(k)>-1}
function tabLabel(k){return k==='collection'?(may('payments')?'Collection':'Dues'):TABS[k].label}
function reqCls(st){return st==='Resolved'?'ok':(st==='In progress'?'':(st==='Closed'?'mute':'warn'))}
function watchReq(uid){if(!uid||S.reqUn[uid])return;S.reqUn[uid]=S.db.collection('requests/'+uid+'/items').onSnapshot(function(s){S.reqs[uid]=docs(s);render()},function(){S.reqUn[uid]=null;delete S.reqs[uid]})}
function allReqs(){var o=[];Object.keys(S.reqs).forEach(function(u){S.reqs[u].forEach(function(i){var c=Object.assign({},i);c.uid=u;o.push(c)})});return o}
function myName(){return (S.roles[S.uid]&&S.roles[S.uid].name)||S.names[S.uid]||''}
function myTag(){var r=R();return r&&r!=='member'?' · '+ROLE_LABEL[r]:''}
function firstName(){return myName().split(/\s+/)[0]||''}
function svgI(k){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}
function icoBox(k,c){return '<div class="ico'+(c?' '+c:'')+'">'+svgI(k)+'</div>'}
function tileHtml(i,c,l,v,s){return '<div class="tile">'+icoBox(i,c)+'<b>'+v+'</b><span class="l">'+l+'</span>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'}

function tabsHtml(){var pc=may('payments')?pendingSubs().length:0;
  return tabOrder().map(function(k){return '<button data-act="tab" data-v="'+k+'" class="'+(k===S.tab?'on':'')+'" aria-label="'+tabLabel(k)+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[k]+'</svg>'+tabLabel(k)+(k==='collection'&&pc?'<span class="dot">'+pc+'</span>':'')+'</button>'}).join('')}
function draw(){
  if(S.failed)return;
  if(!S.isOwner&&!R()){
    $('#tabs').innerHTML='';$('#hbtns').innerHTML=window.__signOut?'<button class="chipbtn" data-act="signout">Sign out</button>':'';$('#hbar').innerHTML='';$('header.top small').textContent="Residents' app";
    if(!S.rolesLoaded||!S.jrLoaded)return;
    return gateView()}
  $('#view').dataset.gate='';
  if(!tabOk(S.tab)){S.tab='home';S.shellTab=null}
  $('#bname').textContent=BN();document.title=BN();
  if(S.isOwner&&S.setLoaded&&!S.settings.setupDone&&!S.setupShown){S.setupShown=true;setTimeout(formSetup,0)}
  var t=TABS[S.tab];
  $('#tabs').innerHTML=tabsHtml();$('#tabs').style.gridTemplateColumns='repeat('+tabOrder().length+',minmax(0,1fr))';
  $('header.top small').textContent="Residents' app · "+ROLE_LABEL[R()];
  var nc=notifCount();
  applySkin(curSkin());syncGroups();
  var hb='<button class="chipbtn bell" data-act="inbox" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON.notices+'</svg>'+(nc?'<span class="bn">'+nc+'</span>':'')+'</button>';
  if(window.__signOut)hb+='<button class="chipbtn" data-act="signout">Sign out</button>';

  if(may('people')||may('financeAssign')){var jc=S.joinAll.filter(function(j){return j.status==='Pending'}).length;bb+='<button class="chipbtn" data-act="people">People'+(jc?' · '+jc:'')+'</button>'}
  if(importKeys().length)bb+='<button class="chipbtn" data-act="import">Import/Export</button>';
  if(R()==='super')bb+='<button class="chipbtn" data-act="manage">Manage</button><button class="chipbtn" data-act="settings">Settings</button>';
  bb+='<button class="chipbtn" data-act="skin">Theme</button>';

    $('#view').innerHTML='<div id="banner"></div><div id="body" style="display:flex;flex-direction:column;gap:14px"></div>';
    $('#body').innerHTML=t.shell();S.shellTab=S.tab;bindShell()}
  var b=$('#banner');
  b.innerHTML=(S.tab==='home'?'':myAlert())+((R()&&R()!=='member'&&!S.isAdmin)?'<div class="banner alert" style="margin-bottom:8px"><span>Your role needs Editor access to see and record accounts, people and receipts. Ask the building owner to share the app with you as an Editor.</span></div>':'')+(S.sampleCount?'<div class="banner" style="margin-top:8px"><span>Some entries are sample data so you can try the app.</span>'+(may('people')?'<button class="btn small" data-act="clearSamples">Remove samples</button>':'')+'</div>':'');
  t.fill();syncStats()
}
function bindShell(){
  var q=$('#q');if(q)q.addEventListener('input',function(){S.q=q.value;TABS.directory.fill()});
  var cf=$('#chatForm');if(cf){cf.addEventListener('submit',async function(e){e.preventDefault();var i=$('#chatText');var text=i.value.trim();var img=S.chatImg||'';if(!text&&!img)return;i.value='';S.chatImg='';chatPrev();
    var cur=chatCur();var path=cur==='all'?'messages':'groups/'+cur+'/messages';var o={text:text.slice(0,1000),by:S.uid,flat:S.flat||'',name:myName(),tag:myTag().replace(' · ',''),ts:Date.now()};if(img)o.img=img;

  var fl=flats().filter(function(f){if(!applies({flats:ci.flats},f.flat))return false;var d=dueFor(cur,f.flat);return !(d&&d.paid)&&pendingIdsFor(f.flat).indexOf(cur)<0});
  var on=fl.filter(function(f){return uidsForFlat(f.flat).length});
  var past=dueStatus(ci).lvl>=2;
  var text='Gentle reminder: '+ci.title+' ('+fmt(ci.amount)+' per flat) '+(past?'was due on ':'is due on ')+fd(ci.due)+'. Please pay and upload your receipt in the app. If you have already paid, thank you!';
  if(!fl.length){toast('Every flat has paid or has a receipt under review.');return}
  openSheet('Remind unpaid flats','<div class="meta">'+fl.length+' flat'+(fl.length>1?'s have':' has')+' not paid. '+on.length+' will get an in-app notification. '+(fl.length-on.length)+' are not on the app yet, so use WhatsApp for them.</div>'+area('text','Message to residents',text,'required maxlength="300"'),'Send reminder',function(d){
    if(!on.length){toast('None of these flats are on the app yet.');return false}
    return pushReminders(fl.map(function(f){return {flat:f.flat,text:d.text,key:slug(cur)}}))})}
function groupText(){var rows=defaulterRows(3).concat(defaulterRows(2));if(!rows.length)return '';
  return 'Gentle reminder from '+BN()+' management: maintenance and collections for flat'+(rows.length>1?'s':'')+' '+rows.map(function(r){return r.f.flat}).join(', ')+' '+(rows.length>1?'are':'is')+' pending. If you have already paid, please upload your receipt in the app. Thank you for your cooperation.'}
function rowCard(r,tone){
  var ids=uidsForFlat(r.f.flat);var unpend=r.lines.filter(function(x){return !x.pend}).length;
  return '<div class="card"><div class="row"><div class="res" style="align-items:center"><div class="flatno">'+esc(r.f.flat)+'</div><div><div class="title">'+esc(r.name||'')+'</div><div class="meta">'+r.days+' day'+(r.days===1?'':'s')+' past due</div></div></div><span class="pill '+tone+'">'+fmt(r.total)+'</span></div>'+
    r.lines.map(function(x){return '<div class="meta">'+esc(x.c.title)+' · '+fmt(x.c.amount)+' · due '+fd(x.c.due)+(x.pend?' · <b>receipt under review</b>':'')+'</div>'}).join('')+
    '<div class="actions">'+(ids.length&&unpend?'<button class="btn small" data-act="remindFlat" data-flat="'+esc(r.f.flat)+'">Send app reminder</button>':'')+
    (r.phone&&waNumber(r.phone)?'<a class="btn ghost small" target="_blank" rel="noopener" href="'+waLink(r.phone,reminderText(r.f))+'">WhatsApp</a>':'')+'<button class="btn ghost small" data-act="copyMsg" data-flat="'+esc(r.f.flat)+'">Copy message</button></div>'+
    (!ids.length?'<div class="meta">Not on the app yet'+(r.phone&&waNumber(r.phone)?'. Use WhatsApp.':' and no phone number on file.')+'</div>':'')+
    (unpend===0?'<div class="meta">Payment already submitted. Check receipts to review.</div>':'')+'</div>'}
function openQueue(i){
  var rows=defaulterRows(3).concat(defaulterRows(2)).filter(function(r){return r.phone&&waNumber(r.phone)});
  if(!rows.length){toast('No flats with a phone number to message.');return}
  if(i>=rows.length){infoSheet('All done','<div class="empty"><b>Reminders done</b>You went through every flat.</div>');return}
  var r=rows[i];
  infoSheet('Reminder '+(i+1)+' of '+rows.length,'<div class="card"><div class="title">Flat '+esc(r.f.flat)+' · '+esc(r.name||'')+'</div><div class="meta">'+fmt(r.total)+' pending · sent privately, never to the group</div><div class="body">'+esc(reminderText(r.f))+'</div><div class="actions"><a class="btn" target="_blank" rel="noopener" href="'+waLink(r.phone,reminderText(r.f))+'">Open WhatsApp</a><button class="btn ghost" data-act="queueNext" data-i="'+(i+1)+'">Next flat</button></div></div>')}
function openDefaulters(){
  var o3=defaulterRows(3),o2=defaulterRows(2);var all=o3.concat(o2);
  var onApp=all.filter(function(r){return uidsForFlat(r.f.flat).length&&inAppText(r.f)}).length;
  var h='<div class="stats"><div class="stat"><span>Flats with outstanding dues</span><b>'+o3.length+'</b></div><div class="stat"><span>Outstanding amount</span><b>'+fmt(sum(o3,function(r){return r.total}))+'</b></div></div>'+
    (o2.length?'<div class="meta">'+o2.length+' more flat'+(o2.length>1?'s are':' is')+' overdue by 1 to 3 days.</div>':'');
  if(all.length)h+='<div class="actions">'+(onApp?'<button class="btn" data-act="remindAll">Send app reminder to all ('+onApp+')</button>':'')+'<button class="btn ghost" data-act="queue">Send privately, one by one</button></div>';
  h+=(o3.length?'<div class="meta">Outstanding</div>'+o3.map(function(r){return rowCard(r,'bad')}).join(''):'')+(o2.length?'<div class="meta">Overdue by 1 to 3 days</div>'+o2.map(function(r){return rowCard(r,'warn')}).join(''):'');
  if(!all.length)h+='<div class="empty"><b>Nothing outstanding</b>Every flat is either paid or not yet past its due date.</div>';
  infoSheet('Outstanding dues',h)}
function myAlert(){
  if(!S.flat)return '';
  var lines=owedFor(S.flat).filter(function(x){return !x.pend});
  var od=lines.filter(function(x){return x.st.lvl===3});
  var soon=lines.filter(function(x){return x.st.lvl===1||x.st.lvl===2});
  if(od.length){var t=sum(od,function(x){return x.c.amount});return '<div class="banner bad" style="margin-bottom:8px"><span>Outstanding: '+fmt(t)+' ('+(od.length>2?od.length+' charges':od.map(function(x){return esc(x.c.title)}).join(', '))+')</span><button class="btn small" data-act="gotab" data-v="collection">Pay now</button></div>'}
  if(soon.length){var t2=sum(soon,function(x){return x.c.amount});return '<div class="banner alert" style="margin-bottom:8px"><span>'+fmt(t2)+' · '+esc(soon[0].st.t)+(soon.length>1?' and more':'')+'</span><button class="btn small" data-act="gotab" data-v="collection">Open</button></div>'}
  return ''}

/* ---------- reminders, defaulters and notifications ---------- */
function waNumber(p){var d=String(p||'').replace(/\D/g,'');if(!d)return '';if(d.indexOf('00')===0)d=d.slice(2);else if(d.charAt(0)==='0')d=((S.settings&&S.settings.cc)||'92')+d.slice(1);return d.length>=10?d:''}
function waLink(phone,text){return 'https://wa.me/'+(waNumber(phone)||'')+'?text='+encodeURIComponent(text)}
async function copyText(t){if(!t){toast('Nothing to copy');return}try{await navigator.clipboard.writeText(t);toast('Message copied. Paste it in WhatsApp.')}catch(e){toast('Copy did not work. Press and hold the text to select it.')}}
function pendingIdsFor(flat){var ids=[];allSubs().forEach(function(s){if(s.status==='Pending'&&String(s.flat).toUpperCase()===String(flat).toUpperCase())(s.charges||[s.charge]).forEach(function(i){ids.push(i)})});return ids}
function owedFor(flat){var pend=pendingIdsFor(flat);
  return myCharges(flat).filter(function(c){var du=dueFor(c.id,flat);return !(du&&du.paid)&&c.amount>0}).map(function(c){return {c:c,st:dueStatus(c),pend:pend.indexOf(c.id)>-1}})}
function overdueDays(c){return c.due?-dayDiff(c.due,todayStr()):0}
function reminderText(f){
  var lines=owedFor(f.flat).filter(function(x){return x.st.lvl>=2});
  var tot=sum(lines,function(x){return x.c.amount});
  var nm=(f.name&&f.name!=='Name not added yet')?' '+f.name:'';
  return 'Assalam o Alaikum'+nm+',\nA reminder from '+BN()+' management for flat '+f.flat+'. These are pending:\n'+lines.map(function(x){return '- '+x.c.title+': '+fmt(x.c.amount)+' (due '+fd(x.c.due)+')'}).join('\n')+'\nTotal: '+fmt(tot)+'\nPlease pay and upload your receipt in the '+BN()+' app. If you have already paid, please ignore this message. Jazak Allah.'}
function notifItems(){
  var cut=Date.now()-14*86400000;var seen=Number(S.profile.seen)||0;var attn=[],ev=[];
  if(S.flat)owedFor(S.flat).filter(function(x){return !x.pend&&x.st.lvl>=1}).forEach(function(x){
    attn.push({title:x.c.title+' · '+fmt(x.c.amount),sub:x.st.t+' · due '+fd(x.c.due),cls:x.st.cls,lbl:(x.st.lvl===3?'Outstanding':(x.st.lvl===2?'Overdue':'Due')),tab:'collection'})});
  if(may('payments')){var pc=pendingSubs().length;if(pc)attn.push({title:pc+' receipt'+(pc>1?'s':'')+' to check',sub:'Residents are waiting for approval',cls:'warn',lbl:'Review',tab:'collection'});
    var dr=defaulterRows();if(dr.length)attn.push({title:dr.length+' flat'+(dr.length>1?'s':'')+' with outstanding dues',sub:'Total '+fmt(sum(dr,function(r){return r.total})),cls:'bad',lbl:'Outstanding',tab:'collection'})}
  if(may('people')){var jc=S.joinAll.filter(function(j){return j.status==='Pending'}).length;if(jc)attn.push({title:jc+' join request'+(jc>1?'s':''),sub:'Open People to approve',cls:'warn',lbl:'Review',tab:'directory'})}
  S.notices.forEach(function(n){if((n.ts||0)>cut)ev.push({ts:n.ts,title:(n.kind==='Urgent'?'Urgent: ':'')+n.title,sub:'New notice',tab:'notices'})});
  S.drives.forEach(function(d){if((d.ts||0)>cut&&(!S.flat||applies(d,S.flat)))ev.push({ts:d.ts,title:'New collection: '+d.title,sub:fmt(d.amount)+' per flat · due '+fd(d.due),tab:'collection'})});
  mySubs().forEach(function(s){if((s.decidedTs||0)>cut&&(s.status==='Approved'||s.status==='Rejected'))ev.push({ts:s.decidedTs,title:'Receipt '+s.status.toLowerCase()+' · '+(s.charges||[s.charge]).map(chargeTitle).join(' + '),sub:s.status==='Rejected'&&s.note?s.note:fmt(s.amount),tab:'collection'})});
  (S.reqs[S.uid]||[]).forEach(function(c){if((c.statusTs||0)>cut)ev.push({ts:c.statusTs,title:'Your request is now '+String(c.status).toLowerCase(),sub:c.reply||c.title,tab:'requests'})});
  if(may('requests')){var oc=allReqs().filter(function(c){return (c.status||'Open')==='Open'}).length;if(oc)attn.push({title:oc+' open request'+(oc>1?'s':''),sub:'Residents are waiting for a reply',cls:'warn',lbl:'Review',tab:'requests'})}
  if(may('expense')){var pa=pendingAdv(monthOf(new Date()));if(pa.length)attn.push({title:'Advance deductions due',sub:fmt(sum(pa,function(x){return x.amount}))+' to deduct from salaries',cls:'warn',lbl:'Salary',tab:'accounts'})}
  S.rem.forEach(function(r){if((r.ts||0)>cut)ev.push({ts:r.ts,title:'Payment reminder from the committee',sub:r.text,tab:'collection'})});
  ev.sort(function(a,b){return b.ts-a.ts});ev.forEach(function(e){e.unread=e.ts>seen});
  return {attn:attn,ev:ev}}
function notifCount(){try{var n=notifItems();return n.attn.length+n.ev.filter(function(e){return e.unread}).length}catch(e){return 0}}
function openInbox(){
  var n=notifItems();var h='';
  if(n.attn.length)h+='<div class="sh">Needs your attention</div>'+n.attn.map(function(a){return '<div class="card attn"><div class="row"><div><div class="title">'+esc(a.title)+'</div><div class="meta">'+esc(a.sub)+'</div></div><span class="pill '+a.cls+'">'+esc(a.lbl||'Due')+'</span></div><div class="actions"><button class="btn small" data-act="gotab" data-v="'+a.tab+'">Open</button></div></div>'}).join('');
  h+='<div class="sh">Recent activity</div>'+(n.ev.length?n.ev.map(function(e){return '<div class="card"><div class="row"><div><div class="title">'+(e.unread?'<span class="new"></span>':'')+esc(e.title)+'</div><div class="meta">'+esc(e.sub)+'</div></div><span class="meta">'+fd(e.ts)+'</span></div><div class="actions"><button class="btn ghost small" data-act="gotab" data-v="'+e.tab+'">Open</button></div></div>'}).join(''):'<div class="empty"><b>Nothing new</b>Notices, new collections and updates on your receipts and requests appear here.</div>');
  infoSheet('Notifications',h);$('#sheet').dataset.k='inbox';
  if(n.ev.some(function(e){return e.unread}))saveProfile({seen:Date.now()}).then(function(){setTimeout(draw,0)})}

/* ---------- collection types ---------- */
function parseFlats(s){return (s||'').split(/[,\s]+/).map(function(x){return x.trim().toUpperCase()}).filter(Boolean)}
function formType(){
  var next=nextMonth(monthOf(new Date()));
  openSheet('Add collection type',field('title','Name','text','','required maxlength="60" placeholder="e.g. Gas, Tanker, Diesel for generator"')+
    '<label class="f" style="flex-direction:row;align-items:center;gap:10px"><input id="f_rec" name="rec" type="checkbox" style="width:auto" checked><span style="font-size:15px;color:var(--ink)">Repeats every month</span></label>'+
    field('amount','Amount per flat (Rs)','number','','required min="1" step="1" inputmode="numeric"')+
    '<div id="grpRec" style="display:flex;flex-direction:column;gap:12px">'+field('start','Starts from month','month',next,'')+field('dueDay','Due on day of month','number','8','min="1" max="28" step="1" inputmode="numeric"')+'</div>'+
    '<div id="grpOnce" hidden style="display:flex;flex-direction:column;gap:12px">'+field('inDays','Due in how many days from today (0 = today)','number','1','min="0" max="60" step="1" inputmode="numeric"')+'</div>'+
    field('flats','Only for these flats (leave empty for all flats)','text','','maxlength="120" placeholder="e.g. 204 or G3, 105"')+area('note','Details for residents','','maxlength="400"'),'Save',async function(d){
    var flats=parseFlats(d.flats);
    if(d.rec){var dd=Number(d.dueDay)||8,gd=dd+3;var st=d.start||next;var pref=S.db.collection('plans').doc();
      var ok=await run(function(){return pref.set({title:d.title,kind:'monthly',rates:[{from:st,amount:Number(d.amount)}],dueDay:dd,graceDay:gd,start:st,flats:flats,note:d.note,ts:Date.now()})});
      if(ok){S.plan=pref.id;S.drive=null;toast('Monthly collection added')}return ok}
    var due=addDays(todayStr(),Math.max(0,Number(d.inDays)||0));var grace=addDays(due,3);var dref=S.db.collection('drives').doc();
    var ok2=await run(function(){return dref.set({title:d.title,amount:Number(d.amount),flats:flats,due:due,grace:grace,note:d.note,ts:Date.now(),kind:'once'})});
    if(ok2){S.drive=dref.id;toast('Collection started. Due '+fd(due))}return ok2},'',function(f){
    var c=f.querySelector('#f_rec');function t(){f.querySelector('#grpRec').hidden=!c.checked;f.querySelector('#grpOnce').hidden=c.checked}c.addEventListener('change',t);t()})}
function formPlan(p){
  if(!p)return;var next=nextMonth(monthOf(new Date()));
  openSheet(p.title,'<div class="meta">Current rate '+fmt(rateFor(p,monthOf(new Date())))+'. A new rate applies from the month you choose. Earlier months keep their old rate.</div>'+
    field('amount','New amount per flat (Rs)','number','','min="1" step="1" inputmode="numeric" placeholder="Leave empty to keep the rate"')+field('from','New rate starts from month','month',next,'')+
    field('dueDay','Due on day of month','number',p.dueDay||8,'required min="1" max="28" step="1" inputmode="numeric"'),'Save changes',function(d){
    var rates=(p.rates||[]).filter(function(r){return r.from!==d.from});
    if(d.amount&&d.from)rates.push({from:d.from,amount:Number(d.amount)});else rates=(p.rates||[]).slice();
    rates.sort(function(a,b){return a.from<b.from?-1:1});
    var dd=Number(d.dueDay)||8,gd=dd+3;
    var body={rates:rates,dueDay:dd,graceDay:gd};
    if(p.virtual){body.title=p.title;body.kind='monthly';body.legacy=true;body.start=monthOf(new Date());body.ts=Date.now();return run(function(){return S.db.collection('plans').add(body)})}
    return run(function(){return S.db.doc('plans/'+p.id).update(body)})})}

  var h='<div class="meta">Repeating every month</div>'+planList().map(function(p){

function openPeople(){

function expMonth(e){return e.month||String(e.date).slice(0,7)}
function budgetItems(){return S.budget.filter(function(b){return !b.archived}).sort(function(a,b){return (a.order||0)-(b.order||0)||(a.ts||0)-(b.ts||0)})}
function actualList(b,m){return S.expenses.filter(function(e){return e.budgetId===b.id&&expMonth(e)===m})}
function pendingAdv(m){return S.advances.filter(function(a){return !a.recovered&&(a.deductMonth||'')<=m})}
function budgetTotals(m){var conf=0,tent=0;
  budgetItems().forEach(function(b){var al=actualList(b,m);if(al.length)conf+=sum(al,function(x){return x.amount});else tent+=Number(b.amount)||0});
  var unb=sum(S.expenses.filter(function(e){return expMonth(e)===m&&!e.budgetId}),function(e){return e.amount});
  var spent=sum(S.expenses.filter(function(e){return expMonth(e)===m}),function(e){return e.amount});
  return {conf:conf,tent:tent,unb:unb,spent:spent,anticipated:conf+tent+unb}}
function computeStats(){
  var m=monthOf(new Date());var pays=paidDues();
  var fund=(Number(S.settings.opening)||0)+sum(pays,function(d){return d.amount})+sum(S.income,function(d){return d.amount})-sum(S.expenses,function(e){return e.amount});
  var payM=pays.filter(function(d){return d.paidOn&&monthOf(new Date(d.paidOn))===m});
  var incM=S.income.filter(function(i){return String(i.date).slice(0,7)===m});
  var received=sum(payM,function(d){return d.amount})+sum(incM,function(d){return d.amount});
  var bt=budgetTotals(m);var fl=flats();var expected=0,paidF=0;
  var plans=planList().filter(function(p){return (p.start||m)<=m});
  fl.forEach(function(f){var ps=plans.filter(function(p){return applies(p,f.flat)});if(!ps.length)return;var all=true;
    ps.forEach(function(p){expected+=rateFor(p,m);var du=dueFor(planChargeId(p,m),f.flat);if(!(du&&du.paid))all=false});if(all)paidF++});
  return {month:m,fund:fund,received:received,expected:expected,paidFlats:paidF,totalFlats:fl.length,spent:bt.spent,anticipated:bt.anticipated}}
var syncT=null;
function syncStats(){
  if(!may('expense'))return;
  var need=['residents','expenses','income','dues','plans','budget','advances','drives'];
  if(!need.every(function(k){return S.ld[k]}))return;
  clearTimeout(syncT);syncT=setTimeout(function(){
    var s=computeStats();var o=S.stats||{};
    if(['month','fund','received','expected','paidFlats','totalFlats','spent','anticipated'].every(function(k){return o[k]===s[k]}))return;
    s.ts=Date.now();S.stats=s;try{S.db.doc('stats/summary').set(s).catch(function(){})}catch(e){}},1500)}

/* ---------- monthly finance report ---------- */
function headOf(cid){var c=chargeInfo(cid);if(!c)return {k:'x_'+cid,t:'Other collection',kind:'once'};if(c.plan)return {k:'p_'+c.plan.id,t:c.plan.title,kind:'monthly'};return {k:'d_'+cid,t:c.title,kind:'once'}}
function buildReport(m){
  var pays=paidDues(),open=Number(S.settings.opening)||0;
  pays.forEach(function(d){if(d.paidOn&&monthOf(new Date(d.paidOn))<m)open+=Number(d.amount)||0});
  S.income.forEach(function(i){if(String(i.date).slice(0,7)<m)open+=Number(i.amount)||0});
  S.expenses.forEach(function(e){if(expMonth(e)<m)open-=Number(e.amount)||0});
  var payM=pays.filter(function(d){return d.paidOn&&monthOf(new Date(d.paidOn))===m});
  var incM=S.income.filter(function(i){return String(i.date).slice(0,7)===m});
  var expM=S.expenses.filter(function(e){return expMonth(e)===m});
  var fl=flats(),heads={};
  function H(h){return heads[h.k]||(heads[h.k]={t:h.t,kind:h.kind,exp:0,rec:0,pend:0,n:0})}
  allPlans().forEach(function(p){
    if((p.start||'0000-00')>m)return;
    var hasPay=payM.some(function(d){return headOf(chargeOf(d)).k==='p_'+p.id});if(p.archived&&!hasPay)return;
    var h=H({k:'p_'+p.id,t:p.title,kind:'monthly'});var cid=planChargeId(p,m),rate=rateFor(p,m);
    fl.forEach(function(f){if(!applies(p,f.flat))return;h.exp+=rate;var du=dueFor(cid,f.flat);if(!(du&&du.paid))h.pend+=rate})});
  S.drives.forEach(function(d){if(d.ts&&monthOf(new Date(d.ts))>m)return;var h=H({k:'d_'+d.id,t:d.title,kind:'once'});
    fl.forEach(function(f){if(!applies(d,f.flat))return;var a=Number(d.amount)||0;h.exp+=a;var du=dueFor(d.id,f.flat);if(!(du&&du.paid))h.pend+=a})});
  payM.forEach(function(d){var h=H(headOf(chargeOf(d)));h.rec+=Number(d.amount)||0;h.n++});
  var rows=Object.keys(heads).map(function(k){return heads[k]}).filter(function(h){return h.exp||h.rec});
  var inc={};incM.forEach(function(i){inc[i.type]=(inc[i.type]||0)+(Number(i.amount)||0)});
  var incRows=Object.keys(inc).map(function(k){return {t:k,amt:inc[k]}});
  var ids={};budgetItems().forEach(function(b){ids[b.id]=1});
  var fixed=budgetItems().map(function(b){var al=actualList(b,m);return {t:b.name,group:b.group||'Other',est:Number(b.amount)||0,act:al.length?sum(al,function(x){return x.amount}):null,ded:sum(al,function(x){return x.deducted})}});
  var advs=expM.filter(function(e){return e.advanceFor});
  var oneM=expM.filter(function(e){return !(e.budgetId&&ids[e.budgetId])&&!e.advanceFor});
  var oc={};oneM.forEach(function(e){var k=e.category||'Other';(oc[k]=oc[k]||{t:k,amt:0,items:[]});oc[k].amt+=Number(e.amount)||0;oc[k].items.push({date:e.date,note:e.note||'',amt:Number(e.amount)||0})});
  var one=Object.keys(oc).map(function(k){return oc[k]});
  var collected=sum(payM,function(d){return d.amount})+sum(incM,function(d){return d.amount});
  var spent=sum(expM,function(e){return e.amount});
  var grp={};fixed.forEach(function(f){if(f.act!=null)grp[f.group]=(grp[f.group]||0)+f.act});
  var advTot=sum(advs,function(e){return e.amount});if(advTot)grp.Salaries=(grp.Salaries||0)+advTot;
  var sumExp=Object.keys(grp).map(function(k){return {t:k,amt:grp[k]}}).concat(one.map(function(o){return {t:o.t,amt:o.amt}}));
  var sumColl=rows.filter(function(h){return h.rec}).map(function(h){return {t:h.t,amt:h.rec}}).concat(incRows);
  var r={month:m,opening:open,collected:collected,spent:spent,closing:open+collected-spent,rows:rows,incRows:incRows,fixed:fixed,one:one,advs:advs.map(function(e){return {date:e.date,note:e.note||'',amt:Number(e.amount)||0}}),advTot:advTot,deducted:sum(fixed,function(f){return f.ded}),
    sum:{month:m,opening:open,collected:collected,spent:spent,closing:open+collected-spent,coll:sumColl,exp:sumExp}};
  if(m===monthOf(new Date())){var dr=defaulterRows();r.outFlats=dr.length;r.outAmt=sum(dr,function(x){return x.total})}
  return r}

  h+='<div class="card"><h3>One-time expenses</h3>'+(r.one.length?r.one.map(function(o){return '<div class="dueline" style="display:block"><div class="row"><div class="title">'+esc(o.t)+'</div><div class="num">'+fmt(o.amt)+'</div></div>'+o.items.map(function(i){return '<div class="meta">'+fd(i.date)+(i.note?' · '+esc(i.note):'')+' · '+fmt(i.amt)+'</div>'}).join('')+'</div>'}).join(''):'<div class="meta">None</div>')+'</div>';
  h+='<div class="card"><h3>Salary advances</h3>'+rr('Given this month',fmt(r.advTot))+rr('Deducted this month',fmt(r.deducted))+r.advs.map(function(a){return '<div class="meta">'+fd(a.date)+' · '+esc(a.note)+' · '+fmt(a.amt)+'</div>'}).join('')+'</div>';
  if(r.outFlats!=null)h+='<div class="card"><h3>Dues position now</h3>'+rr('Flats outstanding',String(r.outFlats))+rr('Amount outstanding',fmt(r.outAmt))+'</div>';

function summaryText(s){

function csvEsc(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function reportCsv(r){var o=[['Section','Head','Detail','Amount']];
  o.push(['Summary','Opening balance','',r.opening],['Summary','Collected','',r.collected],['Summary','Spent','',r.spent],['Summary','Closing balance','',r.closing]);

    var reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');var msg=m.getMessaging(window.__fbApp);
    var tok=await m.getToken(msg,{vapidKey:S.settings.vapid,serviceWorkerRegistration:reg});
    if(tok){await saveToken(tok,'web');m.onMessage(msg,function(p){var n=p.notification||{};toast((n.title||'')+(n.body?': '+n.body:''))});return true}}catch(e){}return false}
function pushOnce(){if(pushOnce.done||!S.uid||!R()||!S.setLoaded)return;pushOnce.done=true;if(isNativeApp())nativePush();else webPush(false)}
async function callScript(payload){var u=(S.settings||{}).pushUrl;if(!u)return {ok:false,error:'The alerts service is not set up yet. Add its link in Settings.'};
  try{var t=await window.__idToken();var r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({idToken:t},payload))});return await r.json()}catch(e){return {ok:false,error:'Could not reach the alerts service.'}}}
function pushNow(title,body,uids){if(!(S.settings||{}).pushUrl)return;callScript({action:'push',title:title,body:body,uids:uids||null})}
function formResetPin(u){var r=S.roles[u]||{};
  openSheet('Reset PIN for '+(r.name||'resident'),'<div class="meta">Choose a new 6-digit PIN and tell it to them personally. They can sign in with it straight away.</div>'+field('pin','New 6-digit PIN','text','','required pattern="\\d{6}" maxlength="6" inputmode="numeric"'),'Reset PIN',function(d){
    return callScript({action:'resetPin',uid:u,pin:d.pin}).then(function(x){if(x&&x.ok){toast('PIN changed. Tell them the new PIN.');return true}toast((x&&x.error)||'Could not reset the PIN');return false})})}
/* ---------- tick and cross on buttons ---------- */
(function(){var busy=false;
  function mark(){busy=false;document.querySelectorAll('button').forEach(function(b){var t=b.textContent.trim();if(!t||/^[✓✕]/.test(t))return;
    var mk='';if(/^(Close|Cancel|Decline|Reject)$/i.test(t))mk='✕ ';else if(/^Approve/i.test(t))mk='✓ ';else if(b.type==='submit'&&b.closest('form.sheetform'))mk='✓ ';
    if(mk&&!b.children.length)b.textContent=mk+t})}
  new MutationObserver(function(){if(!busy){busy=true;requestAnimationFrame(mark)}}).observe(document.body,{childList:true,subtree:true});
})();

/* ---------- chat groups ---------- */
S.groups={};S.gDoc={};S.gmsgs={};S.gUn={};S.ginv={};S.chatGroup='all';S.chatImg='';
function myGroupIds(){var ids;if(R()==='super')ids=Object.keys(S.groups);else{var g=(S.roles[S.uid]||{}).groups||[];ids=g.filter(function(x){return S.groups[x]})}
  return ids.sort(function(a,b){return String(S.groups[a].name).localeCompare(String(S.groups[b].name))})}
function chatCur(){var c=S.chatGroup;if(c!=='all'&&myGroupIds().indexOf(c)<0)c='all';return c}
function canPostGroup(g){return ((S.roles[S.uid]||{}).groups||[]).indexOf(g)>-1}
function syncGroups(){if(!S.uid||!R())return;
  if(R()==='super'){if(!S.gSuper){S.gSuper=true;S.db.collection('groups').onSnapshot(function(s){var m={};docs(s).forEach(function(d){m[d.id]=d});S.groups=m;render()},function(){S.gSuper=false})}return}
  ((S.roles[S.uid]||{}).groups||[]).forEach(function(g){if(S.gDoc[g])return;S.gDoc[g]=1;S.db.doc('groups/'+g).onSnapshot(function(sn){if(sn.exists){var o=sn.data();o.id=g;S.groups[g]=o}else delete S.groups[g];render()},function(){S.gDoc[g]=0})})}
function watchGroup(g){if(S.gUn[g])return;S.gUn[g]=1;S.db.collection('groups/'+g+'/messages').orderBy('ts','desc').limit(100).onSnapshot(function(sn){S.gmsgs[g]=docs(sn);render();resolveNames(S.gmsgs[g].map(function(c){return c.by}))},function(){S.gUn[g]=0})}
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'})}
function msgHtml(m){var me=m.by&&m.by===S.uid;var nm=me?'You':(m.name||nameOf(m.by)||'Neighbour');
  var share='https://wa.me/?text='+encodeURIComponent((m.name||nm)+': '+(m.text||'')+(m.img?' (photo)':''));
  var acts='<a class="lnk" href="'+esc(share)+'" target="_blank" rel="noopener">Share on WhatsApp</a>'+((me||R()==='super')?'<button class="lnk" type="button" data-act="chatDel" data-id="'+esc(m.id)+'">Delete</button>':'');
  return '<div class="msg'+(me?' me':'')+'"><div class="who">'+esc(nm)+esc(m.tag?' · '+m.tag:roleTag(m.by))+(m.flat?' · '+esc(m.flat):'')+' · '+fd(m.ts)+'</div><div class="bub">'+(m.text?linkify(m.text):'')+(m.img?'<img class="cimg" src="'+m.img+'" alt="Photo" data-act="chatImg" data-id="'+esc(m.id)+'">':'')+'</div><div class="macts">'+acts+'</div></div>'}
function chatImage(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onerror=function(){rej(new Error('read'))};
  fr.onload=function(){var im=new Image();im.onerror=function(){rej(new Error('image'))};
    im.onload=function(){var dim=900,q=.62,out='';
      for(var i=0;i<8;i++){var sc=Math.min(1,dim/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<70000)break;if(q>.4)q-=.08;else dim=dim*.8}
      if(out.length>=110000)rej(new Error('big'));else res(out)};
    im.src=fr.result};fr.readAsDataURL(file)})}
function chatPrev(){var el=$('#chPrev');if(!el)return;if(S.chatImg){el.hidden=false;el.innerHTML='<img src="'+S.chatImg+'" alt="Photo to send"><button class="btn ghost small" type="button" data-act="chatPhotoClear">Remove</button>'}else{el.hidden=true;el.innerHTML=''}}
function setGroups(u,fn){var cur=((S.roles[u]||{}).groups||[]).slice();var nx=fn(cur);return S.db.doc('roles/'+u).update({groups:nx})}
function memberChoices(sel){var ids=Object.keys(S.roles).sort(function(a,b){return natural(S.roles[a].flat||'',S.roles[b].flat||'')});
  return ids.map(function(u){var r=S.roles[u];return '<label class="mrow"><input type="checkbox" name="m_'+esc(u)+'"'+(sel(u,r)?' checked':'')+'><span><b>'+esc(r.name||'Unnamed')+'</b><br><span class="meta">Flat '+esc(r.flat||'?')+(r.relation?' · '+esc(r.relation):'')+' · '+esc(ROLE_LABEL[r.role]||r.role)+'</span></span></label>'}).join('')}
function formGroupNew(){
  openSheet('New chat group','<div class="meta">Create a private group such as Ladies, Owners or Committee. Only its members (and you, privately) can see it.</div>'+field('name','Group name','text','','required maxlength="40"')+
    select('start','Start with',['Nobody (I will choose)','All members','Owners only','Tenants only','Committee and finance'],'Nobody (I will choose)')+field('wa','WhatsApp group link (optional)','url','','maxlength="200"'),'Create group',function(d){
    return run(async function(){var r=await S.db.collection('groups').add({name:d.name.slice(0,40),wa:d.wa||'',by:S.uid,ts:Date.now()});var gid=r.id;
      var pick=Object.keys(S.roles).filter(function(u){var x=S.roles[u];if(d.start==='All members')return true;if(d.start==='Owners only')return x.relation==='Owner';if(d.start==='Tenants only')return x.relation==='Tenant';if(d.start==='Committee and finance')return x.role==='committee'||x.role==='finance';return false});
      for(var i=0;i<pick.length;i++)await setGroups(pick[i],function(c){if(c.indexOf(gid)<0)c.push(gid);return c});
      S.chatGroup=gid;S.chatImg='';toast('Group created')})})}
function formGroupManage(gid){var g=S.groups[gid];if(!g)return;
  var inv='https://wa.me/?text='+encodeURIComponent('Join our building app'+(S.settings&&S.settings.name?' ('+S.settings.name+')':'')+': '+location.origin+location.pathname);
  openSheet('Manage group',field('name','Group name','text',g.name,'required maxlength="40"')+field('wa','WhatsApp group link (optional)','url',g.wa||'','maxlength="200"')+
    '<div class="meta">Members. Only members can read or post. You can still watch every group privately.</div>'+memberChoices(function(u){return ((S.roles[u]||{}).groups||[]).indexOf(gid)>-1})+
    area('phones','Add by phone numbers (for example copied from a WhatsApp group). One per line.','','rows="3" placeholder="0300 1234567"')+
    '<div class="meta">Numbers already on the app join now. The rest join automatically when you approve them.</div>',
    'Save group',async function(d){
    return run(async function(){
      await S.db.doc('groups/'+gid).update({name:d.name.slice(0,40),wa:d.wa||''});
      var ids=Object.keys(S.roles);
      for(var i=0;i<ids.length;i++){var u=ids[i];var want=!!d['m_'+u];var has=((S.roles[u]||{}).groups||[]).indexOf(gid)>-1;
        if(want&&!has)await setGroups(u,function(c){c.push(gid);return c});else if(!want&&has)await setGroups(u,function(c){return c.filter(function(x){return x!==gid})})}
      var nums=String(d.phones||'').split(/[\n,;]+/).map(pk).filter(function(x){return x.length>=10});var joined=0,wait=0;
      for(var j=0;j<nums.length;j++){var k=nums[j];var hit=ids.filter(function(u){return pk(S.roles[u].phone)===k})[0];
        if(hit){await setGroups(hit,function(c){if(c.indexOf(gid)<0)c.push(gid);return c});joined++}
        else{var ex=(S.ginv||{})[k];var gl=((ex&&ex.groups)||[]).slice();if(gl.indexOf(gid)<0)gl.push(gid);await S.db.doc('groupinvites/'+k).set({groups:gl,ts:Date.now()});wait++}}
      toast('Saved'+(nums.length?'. '+joined+' added now, '+wait+' will join when approved':''))}).then(function(ok){return ok})},
    '<a class="btn ghost" href="'+esc(inv)+'" target="_blank" rel="noopener">Invite on WhatsApp</a><button class="btn danger" type="button" data-act="groupDelete" data-v="'+esc(gid)+'">Delete group</button>')}
function openChatTools(){infoSheet('Chat tools','<div class="meta">Photos and messages take up space in the database. Remove old ones from time to time.</div><div class="actions"><button class="btn ghost" data-act="pruneChat" data-v="30">Delete messages older than 30 days</button><button class="btn ghost" data-act="pruneChat" data-v="90">Delete messages older than 90 days</button></div>')}
async function pruneAll(days){var cut=Date.now()-days*86400000;var paths=['messages'].concat(Object.keys(S.groups).map(function(g){return 'groups/'+g+'/messages'}));var n=0;
  var ok=await run(async function(){for(var i=0;i<paths.length;i++){var sn=await S.db.collection(paths[i]).where('ts','<',cut).get();for(var j=0;j<sn.docs.length;j++){await S.db.doc(paths[i]+'/'+sn.docs[j].id).delete();n++}}});
  if(ok){toast(n+' old message'+(n===1?'':'s')+' deleted');closeSheet()}}
window.__start=start;
})();
</script>
